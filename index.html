<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा पहला वेबसाइट</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.3rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 600px;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.1);
            background: #ff5252;
        }
        .footer {
            margin-top: 50px;
            opacity: 0.8;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>नमस्ते! 👋</h1>
        <div class="card">
            <h2>मेरा पहला वेबसाइट GitHub Pages पर</h2>
            <p>यह एक सुंदर और responsive वेबसाइट है जो मैंने बनाई है। आप इसे customize कर सकते हैं।</p>
            <button onclick="alert('धन्यवाद! आपकी वेबसाइट सफलतापूर्वक live है 🎉')">क्लिक करें</button>
        </div>
        <div class="footer">
            Made with ❤️ by Grok &amp; Alokranjan27725<br>
            <a href="https://github.com/Alokranjan27725/my-first-website" style="color: white;">GitHub Repo</a>
        </div>
    </div>
</body>
</html>
